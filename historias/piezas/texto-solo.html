  display: grid;
  place-items: center;
}

/* Lienzo 9:16 que se ajusta a la ventana sin deformarse. */
#lienzo {
  position: relative;
  aspect-ratio: 9 / 16;
  height: min(100vh, 100vw * 16 / 9);
  width: auto;
  max-width: 100vw;
  overflow: hidden;
  background: #000;
  container-type: size;          /* es lo que hace que cqmin funcione */
  color: #fff;
  font-family: "Montserrat", Arial, Helvetica, sans-serif;
  -webkit-font-smoothing: antialiased;
}

/* ---------- el bloque ----------
   Cuatro variables por pieza, porque las decide la foto:
     --ancla   qué borde abraza (bandera hacia ese lado)
     --margen  distancia a ese borde
     --arriba  dónde arranca
     --tinta   color, según la luminancia del parche             */
.bloque {
  --margen: 14.2%;
  --arriba: 12.03%;
  --medida: 55%;
  --tinta: #ffffff;

  position: absolute;
  top: var(--arriba);
  width: var(--medida);
  color: var(--tinta);
}
.bloque[data-ancla="right"] { right: var(--margen); text-align: right; }
.bloque[data-ancla="left"]  { left:  var(--margen); text-align: left;  }

/* Nivel 1 — nombre latino */
.nombre {
  font-size: 4.28cqmin;
  font-weight: 500;
  line-height: 1.12;
}

/* Nivel 2 — hangul. Cuelga del latino con interlineado cerrado: los dos
   leen como UNA unidad, no como dos líneas sueltas. */
.hangul {
  font-family: "Noto Sans KR", "Montserrat", sans-serif;
  font-size: 3.32cqmin;
  font-weight: 400;
  line-height: 1.15;
  margin-top: 0.03em;
}

/* Nivel 3 — bajada */
.bajada {
  font-size: 2.60cqmin;
  font-weight: 400;
  line-height: 1.35;
  margin-top: 0.70em;
}
.bajada + .bajada { margin-top: 1em; }
</style>
</head>
<body>
  <div id="lienzo">
    <div class="bloque" data-ancla="right">
      <h1 class="nombre">Mandu Guk</h1>
      <p class="hangul">만둣국</p>
      <p class="bajada">Hay días en Corea<br />que solo saben a manduguk:<br />los fríos, los lluviosos, los que piden<br />algo que reconforte más que alimente.</p>
    </div>
  </div>
</body>
</html>
